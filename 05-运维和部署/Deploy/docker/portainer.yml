services:
  portainer:
    image: portainer/portainer-ce:2.21.4
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"   # HTTP Web 界面
      - "9443:9443"   # HTTPS Web 界面
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/docker/portainer/data:/data
    environment:
      TZ: Asia/Shanghai
