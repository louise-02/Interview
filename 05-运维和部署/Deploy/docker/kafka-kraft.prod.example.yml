# Kafka KRaft 偏生产示例（单文件仅供单节点参考；三节点 HA 需三台宿主机各一份并改 NODE_ID / IP）
# 复制为 kafka-kraft.yml 或 merge 到现有 compose 后再 up
# 参数说明见 9、kafka.md → Kafka 配置与运维

services:
  kafka:
    image: bitnami/kafka:3.8
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 必改：客户端可达的本机 IP
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://192.168.1.101:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      ALLOW_PLAINTEXT_LISTENER: "yes"
      TZ: Asia/Shanghai
      # 偏生产：副本与 topic 策略（三节点集群时 replication-factor 可设为 3）
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 1
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
    volumes:
      - /data/docker/kafka/data:/bitnami/kafka/data
    mem_limit: 4g
