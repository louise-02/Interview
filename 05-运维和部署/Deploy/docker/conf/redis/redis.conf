# Docker 偏生产示例 → 挂载 /data/docker/redis/conf/redis.conf
# 参数说明见 5、redis.md → Redis 配置与运维
# 部署前必改 requirepass；按宿主机内存调整 maxmemory

bind 0.0.0.0
protected-mode yes

# 部署前改为强密码
requirepass ChangeMe_StrongPassword

# 8GB 混部示例；16GB 专用可改为 10gb～12gb
maxmemory 4gb
maxmemory-policy allkeys-lru

dir /data
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
